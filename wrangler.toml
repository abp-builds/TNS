name = "tns"
main = "worker/index.mjs"
account_id = "6f5f9806e51644f9bef57b025ab402f8"
compatibility_date = "2026-11-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tns-workspace"
database_id = "78d991e3-b039-498c-ae3a-7426341b011c"

[vars]
# If using GitHub Pages for the public frontend, use that exact origin here.
# Admin opens on the backend origin, keeping its HttpOnly cookie first-party.
PUBLIC_ORIGIN = "https://abp-builds.github.io"

[triggers]
crons = ["*/15 * * * *"]

# Admin access is migrated privately into D1. No setup token is exposed here.
